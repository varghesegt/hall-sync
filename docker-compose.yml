name: hallsync

services:
  # --- Database Service (PostgreSQL 16) ---
  db:
    image: postgres:16-alpine
    container_name: hallsync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-exam_seat_allocation}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jittu007}
      TZ: Asia/Kolkata
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - hallsync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- In-Memory Cache & Session Service (Redis 7) ---
  redis:
    image: redis:7.2-alpine
    container_name: hallsync-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword123}
    volumes:
      - redis_data:/data
    networks:
      - hallsync-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redispassword123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- S3 Object Storage Service (MinIO) ---
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: hallsync-minio
    restart: unless-stopped
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - hallsync-network
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Backend Application Service (Spring Boot) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hallsync-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-exam_seat_allocation}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-jittu007}
      APP_SECURITY_USERNAME: ${COE_USER:-coe1@krce.ac.in}
      APP_SECURITY_PASSWORD: ${COE_PASS:-skm@8115}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-KRCE-HallSync-COE-2026-Prod-8f3a9b7c4d2e1f0a5b6c7d8e9f0a1b2c3d4e5f6a}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      AWS_S3_ENDPOINT: http://minio:9000
      APP_AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      JAVA_OPTS: >-
        -Xms512m -Xmx2048m 
        -XX:+UseG1GC 
        -XX:MaxRAMPercentage=75.0 
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
        -Duser.timezone=Asia/Kolkata
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    tmpfs:
      - /app/data/parser-tmp:size=256M,mode=1777
    networks:
      - hallsync-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || curl -f http://localhost:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # --- Frontend Application Service (Nginx + React SPA) ---
  frontend:
    build:
      context: ./allocate-artisan
      dockerfile: Dockerfile
    container_name: hallsync-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - hallsync-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hallsync-network:
    driver: bridge
    name: hallsync-network

volumes:
  pg_data:
    name: hallsync_pg_data
  redis_data:
    name: hallsync_redis_data
  minio_data:
    name: hallsync_minio_data
  uploads_data:
    name: hallsync_uploads_data
  logs_data:
    name: hallsync_logs_data
