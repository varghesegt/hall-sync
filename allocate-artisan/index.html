  <script>
    // Suppress unhandled errors originating from third-party browser extensions (contentScript.js)
    window.addEventListener('unhandledrejection', function(event) {
      if (event && event.reason) {
        var str = String(event.reason.stack || event.reason.message || event.reason);
        if (str.indexOf('contentScript') !== -1 || str.indexOf("'rate'") !== -1) {
          event.preventDefault();
        }
      }
    });
    window.addEventListener('error', function(event) {
      if (event && (
        (event.filename && event.filename.indexOf('contentScript') !== -1) ||
        (event.message && event.message.indexOf("'rate'") !== -1)
      )) {
        event.preventDefault();
      }
    });
  </script>
