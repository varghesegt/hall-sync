server:
  port: 8081
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  datasource:
    hikari:
      # Master DB pool: only used for auth/tenant registry — keep small
      maximum-pool-size: 5
      minimum-idle: 2
      max-lifetime: 600000       # 10 minutes
      connection-timeout: 5000   # 5 seconds (fail fast)
      idle-timeout: 300000       # 5 minutes

  jpa:
    hibernate:
      ddl-auto: validate # Do not auto-update schema in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Caffeine cache for read-heavy endpoints (halls, faculty, sessions)
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

logging:
  level:
    root: INFO
    com.exam: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: hallsync

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://app.hallsync.com}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
  aws:
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      endpoint: ${AWS_S3_ENDPOINT:}
      bucket-name: ${AWS_S3_BUCKET_NAME:hallsync-prod-uploads}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
