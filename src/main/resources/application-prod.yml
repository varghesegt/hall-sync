server:
  address: 0.0.0.0
  port: ${PORT:10000}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  datasource:
    hikari:
      # Master DB pool: only used for auth/tenant registry — keep small for cloud free tier
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:3}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      max-lifetime: 600000       # 10 minutes
      connection-timeout: 5000   # 5 seconds (fail fast)
      idle-timeout: 300000       # 5 minutes

  jpa:
    hibernate:
      ddl-auto: validate # Do not auto-update schema in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  cache:
    type: simple

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging:
  level:
    root: INFO
    com.exam: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
    redis:
      enabled: false
  metrics:
    tags:
      application: hallsync

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://*.vercel.app,https://hall-sync-six.vercel.app,http://localhost:8081,http://localhost:8080,http://localhost:5173}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  aws:
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
    s3:
      endpoint: ${AWS_S3_ENDPOINT:http://minio:9000}
      bucket-name: ${AWS_S3_BUCKET_NAME:hallsync-uploads}
