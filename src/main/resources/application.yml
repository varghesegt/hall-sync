server:
  port: ${PORT:8081}

app:
  security:
    username: "hallsync@admin"
    password: ${APP_ADMIN_PASSWORD:12345678}
  jwt:
    secret: ${APP_JWT_SECRET:super-secret-local-dev-key-change-in-prod-1234567890!@#$%-hallsync-jwt}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  aws:
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
    s3:
      endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
      bucket-name: ${AWS_S3_BUCKET_NAME:hallsync-uploads}

spring:
  cache:
    type: simple
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://localhost:5432/exam_seat_allocation
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${DB_PASSWORD:jittu007}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO

parser:
  max-file-size-mb: 50

  register-patterns:
    - "^[A-Z]{2,6}[0-9]{3,10}$"
    - "^[0-9]{2}[A-Z]{2,6}[0-9]{3,10}$"
    - "^[0-9]{4}[A-Z][0-9]{2}[A-Z]{2}[0-9]{3}$"
    - "^[0-9]{12}$"

  departments:
    CSE: ["CSE", "COMPUTER SCIENCE", "CS", "C.S.E", "CSE-A", "CSE-B", "CSE-C", "VERIFY_V5"]
    ECE: ["ECE", "ELECTRONICS", "E&C", "E.C.E", "ECE-A", "ECE-B"]
    MECH: ["ME", "MECHANICAL", "MECH", "MECH-A", "MECH-B"]
    EEE: ["EEE", "ELECTRICAL", "E.E.E", "EEE-A"]
    CIVIL: ["CIVIL", "CIVIL ENGINEERING", "CE", "CIVIL-A"]
    IT: ["IT", "INFORMATION TECHNOLOGY", "I.T", "IT-A", "IT-B"]

  noise-patterns:
    - "^page\\s+\\d+.*$"
    - "^\\d+\\s+of\\s+\\d+$"
    - "^(s\\.?no|register|name|dept|department|roll).*$"

  max-tokens-per-line: 50
  sliding-window-max: 3
  temp-dir: "./data/parser-tmp"

