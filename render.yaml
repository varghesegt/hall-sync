services:
  - type: web
    name: hallsync-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: MANAGEMENT_HEALTH_MAIL_ENABLED
        value: "false"
      - key: APP_SECURITY_USERNAME
        value: coe1@krce.ac.in
      - key: APP_SECURITY_PASSWORD
        value: skm@8115
      - key: APP_JWT_SECRET
        value: KRCE-HallSync-COE-2026-Prod-8f3a9b7c4d2e1f0a5b6c7d8e9f0a1b2c3d4e5f6a
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "http://localhost:8080,http://localhost:5173,https://*.vercel.app"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: hallsync-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: hallsync-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hallsync-db
          property: password

databases:
  - name: hallsync-db
    plan: free
    databaseName: exam_seat_allocation
    user: postgres
